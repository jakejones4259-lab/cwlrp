<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="Exoduslogo.png">
    <title>Exodus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #191b2a;
            --text-main: #ffffff;
            --text-muted: #8e9ab0;
            --accent-green: #27d983;
            --card-bg: linear-gradient(360deg, #2D2F47, #282B40);
            --nav-bg: #23283c;
        }
        #device-frame {
            max-width: 450px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #151726;
            color: var(--text-main);
            overscroll-behavior-y: none;
            height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0e15;
            z-index: 1;
        }
        
        #settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0e15;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #settings-overlay.active {
            transform: translateY(0);
        }

        .settings-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 20px;
            padding-top: calc(env(safe-area-inset-top, 20px) + 10px);
            box-sizing: border-box;
            background-color: #0d0e15; /* Match overlay background */
            z-index: 1;
            flex-shrink: 0; /* Prevent header from shrinking */
        }

        #settings-asset-list {
            flex-grow: 1; /* Allow list to take remaining space */
            overflow-y: auto; /* Enable scrolling for the list */
            padding: 0 20px 20px 20px; /* Add padding */
            box-sizing: border-box;
        }
        .close-settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        .close-settings-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-main);
            stroke-width: 2;
        }

        #app-container {
            width: 100%;
            height: calc(100% - 50px); /* Leave space at top */
            margin-top: 50px; /* Push down to reveal background */
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(180deg, #2F3253 0%, #202136 100%);
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            overflow: hidden;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.11);
            z-index: 10;
        }
        
        .pull-indicator {
            width: 40px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 10px auto 5px; /* Center horizontally, add top margin */
            flex-shrink: 0;
        }

        .settings-asset-item {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .settings-asset-icon {
            width: 32px;
            height: 32px;
            margin-right: 12px;
        }
        .settings-asset-info {
            flex-grow: 1;
        }
        .settings-asset-name {
            font-weight: 500;
            font-size: 15px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            margin-left: 15px;
        }
        .toggle-switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3f58;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-green);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .edit-controls {
            display: none; /* Hidden by default */
            padding: 15px;
            background-color: #1e2235;
            margin-top: -10px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-group input {
            flex-grow: 1;
            background-color: #2b3048;
            border: 1px solid #3a3f58;
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-size: 14px;
        }
        .currency-switcher {
            background: none;
            border: none;
            color: var(--accent-green);
            cursor: pointer;
            font-weight: 500;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        .icon-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-main);
        }
        .app-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .scroll-content {
            overflow-y: auto;
            padding: 20px;
            padding-top: 0;
            height: 100%;
            /* Custom Scrollbar for Main Page */
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }
        .scroll-content::-webkit-scrollbar {
            width: 4px;
            display: block; /* Force display */
        }
        .scroll-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0e15;
            z-index: 100; /* On top of everything */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transform: translateY(100%); /* Hidden by default */
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #background-layer.active {
            transform: translateY(0);
        }

        .settings-container {
            width: 100%;
            padding: 20px;
            padding-bottom: 100px;
            box-sizing: border-box;
            /* Hide scrollbar for settings */
            scrollbar-width: none; 
        }
        .settings-container::-webkit-scrollbar {
            display: none;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }
        .close-settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        .close-settings-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-main);
            stroke-width: 2;
        }
        .balance-circle {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 275px; /* Match SVG width */
            height: 275px; /* Match SVG height */
            margin: 0 auto; /* Center the container itself */
        }
        .donut {
            transform: rotate(-90deg);
            /* Ensure SVG doesn't overflow or misalign */
            display: block; 
        }
        .balance-amount {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 600;
            white-space: nowrap; /* Prevent line wrapping */
            font-variant-numeric: tabular-nums; /* Fixes wiggly text by making all digits same width */
        }
        .balance-amount.updating {
            animation: green-blink 0.5s ease-in-out;
        }

        .digit-container {
            display: inline-block;
            position: relative;
            overflow: hidden;
            height: 1.2em; /* Slightly taller to prevent clipping */
            vertical-align: bottom;
        }

        .digit-reel {
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); /* Smoother easing */
            will-change: transform;
        }

        .digit {
            display: block;
            line-height: 1.2em; /* Match container height */
            height: 1.2em;
            text-align: center;
        }
        .digit-reel.moving .digit {
            color: var(--text-muted);
        }

        @keyframes green-blink {
            0%, 100% { color: var(--text-main); }
            50% { color: var(--accent-green); }
        }

        @keyframes quick-fade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        .security-banner {
            background: linear-gradient(90deg, #3a317a 0%, #533e8f 100%);
            border-radius: 10px;
            padding: 15px;
            margin-top: 30px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            z-index: 1;
            position: relative;
        }
        .security-banner-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .security-banner-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .security-title {
            font-weight: 500;
            font-size: 15px;
        }
        .security-subtitle {
            color: #c1bdf5;
            font-size: 13px;
        }
        .close-btn {
            margin-left: auto;
        }
        .close-btn svg {
            stroke: #c1bdf5;
        }
        .asset-list {
            width: 100%;
            margin-top: 0px;
            padding-bottom: 120px; /* For bottom nav */
        }
        .asset-item {
            display: flex;
            align-items: center;
            padding: 25px 0;
            background: linear-gradient(180deg, #2D2F47 0%, #282B40 100%);
            border-radius: 15px;
            margin-bottom: 10px;
            padding: 15px;
        }
        .asset-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .asset-info {
            flex-grow: 1;
        }
        .asset-name {
            font-weight: 500;
            font-size: 16px;
        }
        .asset-price {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }
        .asset-balance {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-variant-numeric: tabular-nums;
        }
        .asset-value-crypto {
            font-weight: 500;
            padding-bottom: 2px;
            font-size: 16px;
        }
        .asset-value-usd {
            color: var(--text-main);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .bottom-nav {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through transparent parts if any */
        }
        .bottom-nav img {
            width: 280px; /* Approximate width for the 3-part menu */
            height: auto;
            pointer-events: auto;
            filter: drop-shadow(0 4px 20px (#1a1b2b));
        }
        .bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(to top, #202136 10%, rgba(19, 20, 31, 0) 100%);
            z-index: 15;
            pointer-events: none;
        }
        .security-banner-img {
            display: block;
            width: 100%;
            height: auto;
            margin-top: 30px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

    <div id="app-container">

                            <!-- Background ring removed as requested -->

                        </div>

                <img src="advancedsecurity.png" class="security-banner-img" alt="Advanced Security">

                <div class="asset-list">
                    <!-- Asset items will be injected here -->

        </main>

        <div class="bottom-fade"></div>
        <div class="bottom-nav">
            <img src="centershit.png" alt="Navigation">

    </div>

                return new Intl.NumberFormat('en-US', {
                    style: 'currency',

        settingsAssetList.addEventListener('change', (e) => {
            if (e.target.type === 'checkbox') {
                const index = e.target.dataset.index;
                const editControls = e.target.closest('.settings-asset-item').nextElementSibling;
                
                assets[index].enabled = e.target.checked;

                if (e.target.checked) {
                    editControls.style.display = 'block';
                    // Maybe set a default value if asset was at 0
                    if (assets[index].value_usd === 0) {
                        assets[index].value_usd = 1; // Avoid division by zero
                        assets[index].value_crypto = 1 / assets[index].price;
                    }
                } else {
                    editControls.style.display = 'none';
                    // We don't necessarily need to zero out the value, just hide it
                }
                // We need to re-render the main UI
                renderMainUI();
                renderSettings(); // To update the input fields
            }
        });

        settingsAssetList.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
                const index = e.target.dataset.index;
                const type = e.target.dataset.type;
                const value = parseFloat(e.target.value);

                if (type === 'crypto') {
                    assets[index].value_crypto = value;
                    assets[index].value_usd = value * assets[index].price;
                } else if (type === 'usd') {
                    assets[index].value_usd = value;
                    assets[index].value_crypto = value / assets[index].price;
                }
                
                // No need to re-render everything on every keystroke, but we should update the other input
                const cryptoInput = settingsAssetList.querySelector(`input[data-index="${index}"][data-type="crypto"]`);
                const usdInput = settingsAssetList.querySelector(`input[data-index="${index}"][data-type="usd"]`);
                if (type === 'crypto') {
                    usdInput.value = assets[index].value_usd.toFixed(2);
                } else {
                    cryptoInput.value = assets[index].value_crypto.toFixed(8);
                }

                // Debounce this in a real app, but for now, update on every input
                renderMainUI();

            function animateValue(element, oldVal, newVal, isCurrency = true, useColorEffect = false) {
        // Safety check for undefined/null values
        if (oldVal === undefined || oldVal === null) oldVal = 0;
        if (newVal === undefined || newVal === null) newVal = 0;

        const oldValStr = isCurrency ? formatCurrency(oldVal) : String(oldVal);
        const newValStr = isCurrency ? formatCurrency(newVal) : String(newVal);

        if (oldValStr === newValStr) {
            if(element.textContent !== newValStr) {
                element.textContent = newValStr;
            }
            return;
        }

        element.innerHTML = ''; // Clear previous content

        const isIncreasing = parseFloat(newVal.toString().replace(/[$,]/g, '')) > parseFloat(oldVal.toString().replace(/[$,]/g, ''));

        if (useColorEffect && isIncreasing) {
            element.classList.add('updating');
            setTimeout(() => element.classList.remove('updating'), 500);
        }

        const oldChars = oldValStr.split('');
        const newChars = newValStr.split('');
        const maxLength = Math.max(oldChars.length, newChars.length);

        const paddedOld = oldValStr.padStart(maxLength, ' ');
        const paddedNew = newValStr.padStart(maxLength, ' ');

        for (let i = 0; i < maxLength; i++) {
            const oldChar = paddedOld[i];
            const newChar = paddedNew[i];

            if (oldChar === ' ' && newChar === ' ') continue;

            if (oldChar === newChar) {
                element.appendChild(document.createTextNode(newChar));
            } else {
                const container = document.createElement('span');
                container.className = 'digit-container';

                const reel = document.createElement('span');
                reel.className = 'digit-reel';

                const digitOld = document.createElement('span');
                digitOld.className = 'digit';
                digitOld.textContent = oldChar;

                const digitNew = document.createElement('span');
                digitNew.className = 'digit';
                digitNew.textContent = newChar;

                if (isIncreasing) {
                    reel.appendChild(digitNew);
                    reel.appendChild(digitOld);
                    reel.style.transform = 'translateY(-100%)';
                } else {
                    reel.appendChild(digitOld);
                    reel.appendChild(digitNew);
                    reel.style.transform = 'translateY(0)';
                }

                container.appendChild(reel);
                element.appendChild(container);

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        if (useColorEffect) {
                            reel.classList.add('moving');
                        }
                        reel.style.transform = isIncreasing ? 'translateY(0)' : 'translateY(-100%)';

                        reel.addEventListener('transitionend', () => {
                            if (container.parentNode) {
                                container.parentNode.replaceChild(document.createTextNode(newChar), container);
                            }
                        }, { once: true });
                    });
                });
            }
        }
    }

            function updateBalanceWithAnimation(newTotal) {
                // The animateValue function includes the currency symbol via formatCurrency.
                // We call it directly on the balanceAmount element to avoid a duplicate dollar sign.
                animateValue(balanceAmount, lastTotalValue, newTotal, true, true);
                lastTotalValue = newTotal;
            }

        let lastKnownState = {};

        function createDonutSegment(percent, color, offset, circumference, gapLength) {
                if (percent <= 0) return null;
                const arcLength = (percent / 100) * circumference;
                const visibleArcLength = arcLength - gapLength;
                if (visibleArcLength <= 0) return null;

                const strokeDasharray = `${visibleArcLength} ${circumference - visibleArcLength}`;
                const strokeDashoffset = -(offset / 100 * circumference) - (gapLength / 2);

                const segment = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                segment.setAttribute("cx", "50");
                segment.setAttribute("cy", "50");
                segment.setAttribute("r", "45");
                segment.setAttribute("fill", "transparent");
                segment.setAttribute("stroke", color);
                segment.setAttribute("stroke-width", "1.5");
                segment.setAttribute("stroke-dasharray", strokeDasharray);
                segment.setAttribute("stroke-dashoffset", strokeDashoffset);
                return segment;
            }

            function renderMainUI() {
            donut.innerHTML = '';
            
            const sortedAssets = [...assets].sort((a, b) => b.value_usd - a.value_usd);
            const enabledAssets = sortedAssets.filter(asset => asset.enabled);
            const totalValue = enabledAssets.reduce((sum, asset) => sum + (asset.value_usd || 0), 0);
            adjustBalanceFontSize(balanceAmount, totalValue);
            updateBalanceWithAnimation(totalValue);

            // --- Donut Chart Rendering ---
            const circumference = 2 * Math.PI * 45; // r = 45
            const gapLength = 2; // The length of the gap in SVG units
            let cumulativePercentage = 0;

            if (totalValue > 0) {
                enabledAssets.forEach(asset => {
                    const percent = (asset.value_usd / totalValue) * 100;
                    if (percent > 0) {
                        const segment = createDonutSegment(percent, asset.color, cumulativePercentage, circumference, gapLength);
                        if (segment) {
                            donut.appendChild(segment);
                        }
                        cumulativePercentage += percent;
                    }
                });
            }

            // Render asset list
            assetList.innerHTML = '';
            enabledAssets.forEach(asset => {

                // Asset list item
                const existingElement = assetList.querySelector(`.asset-item[data-symbol='${asset.symbol}']`);
                if (existingElement) {
                    // Update existing element with animation
                    const valueUsdElement = existingElement.querySelector('.asset-value-usd-value');
                    const valueCryptoElement = existingElement.querySelector('.asset-value-crypto');
                    const priceValueElement = existingElement.querySelector('.asset-price-value');
                    const priceChangeElement = existingElement.querySelector('.asset-price-change');

                    const lastState = lastKnownState[asset.symbol] || asset;

                    // Animate USD value
                    animateValue(valueUsdElement, lastState.value_usd, asset.value_usd, true, false);

                    // Animate Price value
                    animateValue(priceValueElement, lastState.price, asset.price, true, false);
                    
                    // Just update crypto and price change text for now
                    valueCryptoElement.textContent = `${(asset.value_crypto || 0).toLocaleString(undefined, {maximumFractionDigits: 8})} ${asset.symbol}`;
                    const changeValue = asset.change || 0;
                    const isPositive = changeValue > 0;
                    const changeColor = isPositive ? 'var(--accent-green)' : 'var(--text-muted)';
                    const changeSign = isPositive ? '+' : '';
                    priceChangeElement.style.color = changeColor;
                    priceChangeElement.textContent = `${changeSign}${changeValue.toFixed(2)}%`;

                } else {
                    renderAssetListItem(asset); // Create new element if it doesn't exist
                }
            });

            // Remove assets that are no longer enabled
            const enabledSymbols = new Set(enabledAssets.map(a => a.symbol));
            Array.from(assetList.children).forEach(item => {
                if (!enabledSymbols.has(item.dataset.symbol)) {
                    item.remove();
                }
            });

            // Update last known state
            assets.forEach(asset => {
                lastKnownState[asset.symbol] = { ...asset };
            });
        }



        function renderAssetListItem(asset) {
            const item = document.createElement('div');
            item.classList.add('asset-item');
            item.dataset.symbol = asset.symbol; // Add symbol for tracking

            const iconContainer = document.createElement('div');
            iconContainer.classList.add('asset-icon-container');

            const icon = document.createElement('img');
            icon.src = asset.icon;
            icon.alt = asset.name;
            icon.classList.add('asset-icon');
            iconContainer.appendChild(icon);

            // if (asset.network === 'eth') {
                // const overlay = document.createElement('div');
                // overlay.classList.add('network-overlay');
                // overlay.innerHTML = `<img src="exoduscoins/ethnetwork.svg" alt="ETH Network">`;
                // iconContainer.appendChild(overlay);
            // }
            

            const changeValue = asset.change || 0;
            const isPositive = changeValue > 0;
            const changeColor = isPositive ? 'var(--accent-green)' : 'var(--text-muted)';
            const changeSign = isPositive ? '+' : '';

            item.innerHTML = `
                <div class="asset-info">
                        <div class="asset-name">${asset.name}</div>
                        <div class="asset-price"><span class="asset-price-value">${formatCurrency(asset.price)}</span> <span class="asset-price-change" style="color: ${changeColor}">${changeSign}${changeValue.toFixed(2)}%</span></div>
                    </div>
                <div class="asset-balance">
                    <div class="asset-value-crypto" style="color: ${asset.color}">${(asset.value_crypto || 0).toLocaleString(undefined, {maximumFractionDigits: 8})} ${asset.symbol}</div>
                    <div class="asset-value-usd"><span class="asset-value-usd-value">${formatCurrency(asset.value_usd)}</span></div>
                </div>
            `;

            item.prepend(iconContainer);
            assetList.appendChild(item);
        }

        function renderSettings() {
            settingsAssetList.innerHTML = '';
            assets.forEach((asset, index) => {
                const assetWrapper = document.createElement('div');

                const item = document.createElement('div');
                item.classList.add('settings-asset-item');
                item.innerHTML = `
                    <img src="${asset.icon}" alt="${asset.name}" class="settings-asset-icon">
                    <div class="settings-asset-info">
                        <div class="settings-asset-name">${asset.name}</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" ${asset.enabled ? 'checked' : ''} data-index="${index}">
                        <span class="slider"></span>
                    </label>
                `;

                const editControls = document.createElement('div');
                editControls.classList.add('edit-controls');
                if (asset.enabled) {
                    editControls.style.display = 'block';
                }
                editControls.innerHTML = `
                    <div class="input-group">
                        <input type="number" value="${(asset.value_crypto || 0).toFixed(8)}" data-index="${index}" data-type="crypto">
                        <span>${asset.symbol}</span>
                        <button class="currency-switcher" data-index="${index}">⇅</button>
                        <input type="number" value="${(asset.value_usd || 0).toFixed(2)}" data-index="${index}" data-type="usd">
                        <span>USD</span>
                    </div>
                `;

                assetWrapper.appendChild(item);
                assetWrapper.appendChild(editControls);
                settingsAssetList.appendChild(assetWrapper);
            });
        }

        async function fetchPrices() {
            const ids = assets.map(a => a.coingecko_id).join(',');
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
                const data = await response.json();

                assets.forEach(asset => {
                    const priceData = data[asset.coingecko_id];
                    if (priceData) {
                        const newPrice = priceData.usd;
                        const newChange = priceData.usd_24h_change;

                        if (newPrice !== undefined) {
                            asset.price = newPrice;
                            // Recalculate USD value based on new price if it's not 0
                            if (asset.value_crypto > 0) {
                                asset.value_usd = asset.value_crypto * asset.price;
                            }
                        }

                        if (newChange !== undefined) {
                            asset.change = newChange;
                        }
                    }
                });

                renderMainUI();
                renderSettings(); // Also update the settings view
            } catch (error) {
                console.error("Error fetching prices:", error);
            }
        }

        // Initial setup
        renderMainUI();
        renderSettings();
        fetchPrices(); // Fetch prices on load
        setInterval(fetchPrices, 60000); // And every 60 seconds

        openSettingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.add('active');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.remove('active');
        });

        // --- Pull Down Interaction (Touch & Mouse) ---
        const scrollContent = document.querySelector('.scroll-content');

        scrollContent.addEventListener('scroll', () => {
            const scrollY = scrollContent.scrollTop;
            const scrollFraction = Math.min(1, scrollY / 200); // Adjust 200 to control fade speed

            bottomNav.style.transform = `translate(-50%, ${scrollFraction * 150}px)`; // Move down 150px
            bottomFade.style.transform = `translateY(${scrollFraction * 150}px)`;
        });

        let startY = 0;
        let isDragging = false;
        let currentTranslateY = 0;

        const startDrag = (y) => {
            if (scrollContent.scrollTop <= 0) {
                startY = y;
            }
        };

        const moveDrag = (y) => {
            const deltaY = y - startY;
            if (scrollContent.scrollTop <= 0 && deltaY > 0) {
                isDragging = true;
                currentTranslateY = deltaY * 0.4;
                if (currentTranslateY > 200) currentTranslateY = 200 + (currentTranslateY - 200) * 0.1;
                appContainer.style.transform = `translateY(${currentTranslateY}px)`;
            } else {
                isDragging = false;
                appContainer.style.transform = '';
            }
        };

        const endDrag = () => {
            if (isDragging) {
                isDragging = false;
                appContainer.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                appContainer.style.transform = '';
                setTimeout(() => {
                    appContainer.style.transition = '';
                }, 300);
            }
        };

        // Touch Events
        appContainer.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
        appContainer.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientY), { passive: true });
        appContainer.addEventListener('touchend', endDrag);

        // Mouse Events (for desktop testing)
        appContainer.addEventListener('mousedown', (e) => {
            startDrag(e.clientY);
            // Add move/up listeners to document to handle dragging outside container
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        const onMouseMove = (e) => {
            // Only move if we started a valid drag (checked in startDrag, but we need to check logic here too)
            // Actually, startDrag just sets startY. We need to check if we should be dragging.
            // If we are dragging, prevent default selection
            if (startY !== 0) { // Simple check, could be more robust
                 moveDrag(e.clientY);
            }
        };

        const onMouseUp = () => {
            endDrag();
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            startY = 0; // Reset
        };
    });
    </script>
    </div>
